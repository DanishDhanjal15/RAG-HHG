name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv venv --python 3.11

      - name: Install
        # CPU wheels only. The default torch wheel is ~2.5 GB of CUDA that CI
        # will never use, and it is only needed here because the ONNX export
        # path imports it.
        run: |
          uv pip install -e ".[dev]" \
            --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lint
        run: uv run ruff check src bench scripts tests

      - name: Test
        # Pipeline tests self-skip without an index, so this is the full suite
        # that can run without a multi-hour build. Everything else -- chunkers,
        # fusion arithmetic, dedup, budget manager, resilience, all three
        # guardrail layers, the FAISS memory-safety regression, STT retry paths,
        # and the extractive generator -- runs here.
        run: uv run pytest -q --durations=10

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        # Build only. Running it would need the ~400 MB index, which lives in a
        # separate repo and is fetched at boot.
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
